<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1624">
<title>Пульт: GECF Summit 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&family=Rubik:wght@300..700&family=Inter:wght@400..900&family=Lora:ital,wght@1,400..600&display=swap">
<style>
:root{--bg:#0B111C;--card:#141D2E;--line:rgba(242,238,230,.12);--ink:#F2EEE6;--mut:#9AA6BA;--blue:#3D6CC0;--red:#D9412F;--gold:#E8B84A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto 12px}
.st{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;background:#6B7280}
.dot.on{background:#3FB96B;box-shadow:0 0 0 4px rgba(63,185,107,.18)}
.dot.off{background:var(--red)}
.pos{font:600 18px 'Oswald',Arial,sans-serif;letter-spacing:.5px}
.sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px 'Rubik',Arial,sans-serif;padding:9px 13px;border-radius:999px;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97)}
#timer{font:600 16px 'Oswald',Arial,sans-serif;font-variant-numeric:tabular-nums;color:var(--gold)}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
@media(max-width:899px){.grid>.pane:first-child{order:2}.prev{max-width:420px}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.prev{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0F1624}
.prev .holder{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.prevtitle{margin:10px 2px 0;font:600 20px 'Oswald',Arial,sans-serif}
.next{margin-top:12px;display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px}
.next .mini{position:relative;width:120px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;background:#0F1624}
.next .mini .holder{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.who{display:inline-block;font:600 13px 'Rubik',Arial,sans-serif;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.who.a{background:rgba(61,108,192,.22);color:#9DBBF0}
.who.d{background:rgba(217,65,47,.2);color:#F3A497}
.blk{padding:12px 14px;border-radius:14px;border:1px solid transparent;margin-bottom:10px;transition:background .3s,opacity .3s}
.blk p{margin:0;font-size:20px;line-height:1.5}
.blk.cur{background:#1C2840;border-color:rgba(232,184,74,.45)}
.blk.done{opacity:.4}
.blk.later{opacity:.55}
.blk .card{font-size:12px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-left:6px}
.hint{margin-top:6px;font-size:14px;color:var(--mut);font-style:italic}
.strip{max-width:1200px;margin:14px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:500 13px 'Rubik',Arial,sans-serif;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.cur{background:#2B4E8C;border-color:#2B4E8C}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(11,17,28,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:12px;z-index:10}
.bar button{appearance:none;border:none;border-radius:18px;font:600 22px 'Oswald',Arial,sans-serif;color:#fff;padding:18px 0;cursor:pointer;user-select:none}
.bar .bk{flex:1;background:#2A3448}
.bar .fw{flex:2.2;background:#2B4E8C}
.bar button:active{filter:brightness(1.2);transform:scale(.98)}
.bar button:disabled{opacity:.4}
.slide aside{display:none}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;margin:0;box-sizing:border-box}
.slide *{box-sizing:border-box;margin:0}
.slide div:not([style*="display"]){display:flex;flex-direction:column}
.slide ul{padding-left:1.1em}
.slide b{font-weight:600}
.slide table{border-collapse:collapse;width:100%}
.slide th,.slide td{padding:.45em .6em;text-align:left;vertical-align:top;border-bottom:1px solid rgba(26,34,51,.14)}
.slide img{display:block}
.slide>:not([style*="position:absolute"]):not(aside){position:relative}
x-icon{display:inline-block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
x-icon[name="Lock"]{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='5' y='11' width='14' height='10' rx='2'/><path d='M8 11V7a4 4 0 0 1 8 0v4'/></svg>")}
x-icon[name="Link"]{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1'/><path d='M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1'/></svg>")}
x-icon[name="Globe"]{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18'/></svg>")}
x-icon[name="Lightning"]{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M13 2 4 14h7l-1 8 9-12h-7z'/></svg>")}
x-icon[name="Activity"]{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h4l3-8 4 16 3-8h4'/></svg>")}
x-icon[name="Warning"]{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 2 21h20z'/><path d='M12 10v5M12 18h0'/></svg>")}
@keyframes epulse{0%,100%{opacity:.55}50%{opacity:1}}
#stage .slide.on svg circle[fill^="url"]{animation:epulse 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#stage .slide.on svg circle[fill^="url"]{animation:none}}

.roles{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.roles button{appearance:none;border:none;background:none;color:var(--mut);font:500 14px 'Rubik',Arial,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.roles button.on{background:#2B4E8C;color:#fff}
.roles button.on{background:#0B7FA0}
.other{padding:10px 14px;border-radius:14px;margin-bottom:10px;border:1px dashed var(--line);color:var(--mut);font-size:15px;line-height:1.45}
.other b{color:var(--ink);font-weight:500}
.other.cur{border-color:rgba(232,184,74,.45);color:#C9D1DE}
.yours{display:inline-block;font:600 12px 'Rubik',Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#0F1624;background:var(--gold);padding:3px 8px;border-radius:6px;margin-left:6px}
.wait{padding:14px;border-radius:14px;background:#1A2234;color:#C9D1DE;font-size:16px;line-height:1.5;margin-bottom:10px}
.wait b{color:var(--ink)}
#rolepick{position:fixed;inset:0;z-index:30;background:rgba(11,17,28,.96);display:none;align-items:center;justify-content:center;padding:20px}
#rolepick.show{display:flex}
#rolepick .box{max-width:420px;width:100%;text-align:center}
#rolepick h2{font:600 26px 'Oswald',Arial,sans-serif;margin:0 0 6px}
#rolepick p{color:var(--mut);margin:0 0 18px}
#rolepick button{display:block;width:100%;appearance:none;border:none;border-radius:16px;padding:18px;margin-bottom:10px;font:600 19px 'Rubik',Arial,sans-serif;color:#fff;cursor:pointer}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2B4E8C;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

<div class="top">
  <div class="st"><span class="dot" id="dot"></span><span id="stt">Подключение…</span></div>

  <div class="roles" id="roles"><button type="button" data-r="s1">1</button><button type="button" data-r="s2">2</button><button type="button" data-r="s3">3</button><button type="button" data-r="s4">4</button><button type="button" data-r="all">Все</button></div>
  <div class="sp"></div>
  <span id="timer">00:00</span>
  <button class="btn" id="tbtn" type="button">Старт таймера</button>

</div>

<h1 data-build-in="rise order 1 auto" style="position:absolute;left:120px;top:210px;width:1100px;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:220px;font-weight:900;line-height:0.95;letter-spacing:-7px;color:#E9F1F8">GECF<br><span style="color:#FFB21E">Summit</span></h1>
<p data-build-in="fade order 2 auto" style="position:absolute;left:128px;top:680px;width:1100px;font-family:'Lora', Georgia, serif;font-style:italic;font-size:48px;line-height:1.25;color:#E9F1F8">Energy security on a par with energy transition</p>

<p style="position:absolute;left:128px;top:56px;width:1300px;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:24px;letter-spacing:3px;color:#8EA5BD"><span style="color:#2ED3F0;font-weight:700">01 CONTEXT</span> <span style="color:#1C3350">—</span> <span style="color:#8EA5BD;font-weight:500">02 AGENDA</span> <span style="color:#1C3350">—</span> <span style="color:#8EA5BD;font-weight:500">03 SUMMIT</span> <span style="color:#1C3350">—</span> <span style="color:#8EA5BD;font-weight:500">04 TAKEAWAYS</span></p><p style="position:absolute;left:1480px;top:46px;width:312px;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:24px;font-weight:700;letter-spacing:3px;text-align:center;color:#06101C;background:#2ED3F0;padding:8px 0px;border-radius:999px">SPEAKER 1</p>
<div style="display:flex;flex-direction:row;gap:64px;align-items:center;margin-top:40px"><div style="flex:1.15;display:flex;flex-direction:column;gap:32px"><p style="font-size:26px;font-weight:600;letter-spacing:6px;color:#2ED3F0">A SHIFT IN PRIORITIES</p><h2 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:88px;font-weight:800;line-height:1.02;letter-spacing:-2px;color:#E9F1F8">Energy <span style="color:#FFB21E">security</span> now matters as much as the transition</h2><p style="font-family:'Lora', Georgia, serif;font-style:italic;font-size:34px;line-height:1.35;color:#8EA5BD">Markets are driven by geopolitics, conflicts and the stability of transport routes</p></div><div style="flex:1;display:flex;flex-direction:column;gap:20px"><div style="display:flex;flex-direction:column;gap:10px;padding:28px 32px;background:#0D1A2B;border:1px solid #1C3350;border-radius:20px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#FF5A5F">GEOPOLITICS</p><p style="font-size:30px;line-height:1.35;color:#E9F1F8">Conflicts and sanctions shape oil and gas markets</p></div><div style="display:flex;flex-direction:column;gap:10px;padding:28px 32px;background:#0D1A2B;border:1px solid #1C3350;border-radius:20px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#FFB21E">MIDDLE EAST</p><p style="font-size:30px;line-height:1.35;color:#E9F1F8">Disrupted routes raise the risk of shortages and price spikes</p></div><div style="display:flex;flex-direction:column;gap:10px;padding:28px 32px;background:#0D1A2B;border:1px solid #1C3350;border-radius:20px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#2ED3F0">STRAIT OF HORMUZ</p><p style="font-size:30px;line-height:1.35;color:#E9F1F8">A key chokepoint for the world’s seaborne oil exports</p></div></div></div>
<p data-build-in="rise order 1" style="position:absolute;left:128px;top:900px;width:1664px;font-size:32px;font-weight:700;line-height:1.3;color:#06101C;background:#FFB21E;padding:22px 36px;border-radius:16px">Not just a meeting of exporters: the future of the market, and of Russia’s place in it</p>
<aside>[Speaker 1] Ladies and gentlemen, the 8th Summit of the Gas Exporting Countries Forum (GECF), held in 2026, is taking place amid major changes in the global energy sector. Today, energy security is becoming just as important as the energy transition itself. The main challenge is that global oil and gas markets are increasingly affected by geopolitical developments, international conflicts and the stability of transportation routes. This is particularly evident in the Middle East. Disruptions to traditional supply routes create the risk of energy shortages and affect global prices. For example, the Strait of Hormuz is strategically important for oil transportation, as a significant share of the world’s seaborne oil exports passes through it. Therefore, this summit is not simply a meeting of major gas exporters. It is a platform where the future of the global energy market and the position of its leading suppliers, including Russia, are being discussed.</aside>
</section>

<h2 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:72px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;color:#0A1626;margin-top:16px">Three issues at the centre of the talks</h2>
<div style="display:flex;flex-direction:row;gap:32px"><div data-build-in="rise order 1" style="position:relative;flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;padding:40px 40px 44px;border-radius:24px;border-top:10px solid #E8890C;box-shadow:0px 18px 44px rgba(10,22,38,0.10)"><div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between"><p style="font-size:80px;font-weight:900;line-height:1;letter-spacing:-2px;color:#E8890C">01</p><x-icon name="Lock" style="color:#E8890C;width:64px;height:64px"></x-icon></div><h3 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:40px;font-weight:800;line-height:1.12;color:#0A1626">Stable supplies</h3><p style="font-size:28px;line-height:1.42;color:#3B4B5E">Alternative routes, LNG infrastructure and long-term contracts</p></div><div data-build-in="rise order 2" style="position:relative;flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;padding:40px 40px 44px;border-radius:24px;border-top:10px solid #0B7FA0;box-shadow:0px 18px 44px rgba(10,22,38,0.10)"><div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between"><p style="font-size:80px;font-weight:900;line-height:1;letter-spacing:-2px;color:#0B7FA0">02</p><x-icon name="Globe" style="color:#0B7FA0;width:64px;height:64px"></x-icon></div><h3 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:40px;font-weight:800;line-height:1.12;color:#0A1626">New geography of trade</h3><p style="font-size:28px;line-height:1.42;color:#3B4B5E">Russia turns to Asia: China and India buy more, Europe stays contested</p></div><div data-build-in="rise order 3" style="position:relative;flex:1;display:flex;flex-direction:column;gap:18px;background:#FFFFFF;padding:40px 40px 44px;border-radius:24px;border-top:10px solid #1E8F62;box-shadow:0px 18px 44px rgba(10,22,38,0.10)"><div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between"><p style="font-size:80px;font-weight:900;line-height:1;letter-spacing:-2px;color:#1E8F62">03</p><x-icon name="Lightning" style="color:#1E8F62;width:64px;height:64px"></x-icon></div><h3 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:40px;font-weight:800;line-height:1.12;color:#0A1626">Energy transition</h3><p style="font-size:28px;line-height:1.42;color:#3B4B5E">Gas remains key, including as a transitional fuel</p></div></div>
<div data-build-in="fade order 4" style="position:absolute;left:128px;top:850px;width:1664px;display:flex;flex-direction:row;align-items:center;gap:64px;border-top:2px solid #D6DEE7;padding:28px 0px 0px 0px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#0B7FA0">GECF MEMBERS</p><div style="display:flex;flex-direction:row;align-items:center;gap:22px"><p style="font-size:72px;font-weight:900;line-height:1;letter-spacing:-2px;color:#C2410C">70%</p><p style="width:300px;font-size:26px;line-height:1.3;color:#3B4B5E">of the world’s natural gas reserves</p></div><div style="display:flex;flex-direction:row;align-items:center;gap:22px"><p style="font-size:72px;font-weight:900;line-height:1;letter-spacing:-2px;color:#0B7FA0">~40%</p><p style="width:300px;font-size:26px;line-height:1.3;color:#3B4B5E">of global gas exports</p></div></div>
<aside>[Speaker 2] Three main issues are at the centre of the discussions. The first is the stability of oil and gas supplies. Due to conflicts and sanctions, many traditional trade and logistics connections have been disrupted. Particular attention is being paid to finding alternative transportation routes, developing liquefied natural gas infrastructure and establishing long-term contracts. The second issue is the changing geography of energy trade. Russia is redirecting a significant part of its energy exports towards Asian markets. China and India are becoming increasingly important buyers. At the same time, competition for the European market continues. The third issue is the energy transition. Summit participants emphasise that natural gas will continue to play an important role in the global economy, including as a transitional energy source. It is worth noting that GECF member countries account for approximately 70% of the world’s natural gas reserves and around 40% of global gas exports. This makes the organisation an important player in international energy politics.</aside>

<p style="font-size:26px;font-weight:600;letter-spacing:6px;color:#2ED3F0;margin-top:24px">VLADIMIR PUTIN · PLENARY SESSION</p>
<div style="display:flex;flex-direction:row;gap:28px;align-items:start"><p style="font-family:'Lora', Georgia, serif;font-size:180px;line-height:0.8;color:#FFB21E">“</p><div style="flex:1;display:flex;flex-direction:column;gap:16px"><h2 style="font-family:'Lora', Georgia, serif;font-style:italic;font-size:78px;font-weight:500;line-height:1.12;color:#E9F1F8">If you dig a pit for someone else, you may fall into it yourself</h2><p style="font-size:32px;line-height:1.4;color:#8EA5BD">On Europe’s decision to abandon Russian energy: it hurts consumers, not only exporters</p></div></div>
<div style="flex:1"></div>
<div style="display:flex;flex-direction:row;gap:24px"><div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:30px 34px;background:#0D1A2B;border:1px solid #1C3350;border-top:6px solid #2ED3F0;border-radius:20px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#2ED3F0">NEW PARTNERS</p><h3 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:36px;font-weight:800;line-height:1.15;color:#E9F1F8">Joint Arctic projects</h3><p style="font-size:27px;line-height:1.38;color:#8EA5BD">Russia is ready to work with new partners, including American companies</p></div><div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:30px 34px;background:#0D1A2B;border:1px solid #1C3350;border-top:6px solid #FFB21E;border-radius:20px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#FFB21E">OUTCOME</p><h3 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:36px;font-weight:800;line-height:1.15;color:#E9F1F8">Moscow Declaration</h3><p style="font-size:27px;line-height:1.38;color:#8EA5BD">Common approaches to the gas market: diversified routes, crisis-response mechanisms, no unilateral coercive measures</p></div></div>
<aside>[Speaker 3] Special attention should be paid to Vladimir Putin’s speech at the summit. His statements became one of the most widely discussed parts of the event. One of his most memorable remarks was: “If you dig a pit for someone else, you may fall into it yourself.” With these words, Putin commented on the decision of European countries to abandon Russian energy resources, emphasising that such decisions could harm not only exporters but also consumers themselves. The President also highlighted the challenges facing the global energy market and the need to develop new areas of international cooperation. Russia expressed its readiness to strengthen energy cooperation with new partners, including through potential joint projects in the Arctic involving American companies. At the end of the summit, the Moscow Declaration was adopted. It reflects the participants’ common approaches to the development of the gas market and international cooperation.</aside>

<h2 style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:72px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;color:#0A1626;margin-top:16px">Adaptability is the new competitiveness</h2>
<div style="display:flex;flex-direction:row;gap:32px"><div style="flex:1;display:flex;flex-direction:column;gap:16px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#0B7FA0">PRIORITIES FOR OIL AND GAS</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div style="display:flex;flex-direction:row;align-items:center;gap:16px;background:#FFFFFF;padding:20px 24px;border-radius:16px;border:1px solid #D6DEE7"><div style="width:14px;height:14px;border-radius:50%;background:#E8890C"></div><p style="font-size:28px;font-weight:600;line-height:1.25;color:#0A1626">Diversify export destinations</p></div><div style="display:flex;flex-direction:row;align-items:center;gap:16px;background:#FFFFFF;padding:20px 24px;border-radius:16px;border:1px solid #D6DEE7"><div style="width:14px;height:14px;border-radius:50%;background:#0B7FA0"></div><p style="font-size:28px;font-weight:600;line-height:1.25;color:#0A1626">Develop LNG transport</p></div><div style="display:flex;flex-direction:row;align-items:center;gap:16px;background:#FFFFFF;padding:20px 24px;border-radius:16px;border:1px solid #D6DEE7"><div style="width:14px;height:14px;border-radius:50%;background:#1E8F62"></div><p style="font-size:28px;font-weight:600;line-height:1.25;color:#0A1626">Build new logistics routes</p></div><div style="display:flex;flex-direction:row;align-items:center;gap:16px;background:#FFFFFF;padding:20px 24px;border-radius:16px;border:1px solid #D6DEE7"><div style="width:14px;height:14px;border-radius:50%;background:#C2410C"></div><p style="font-size:28px;font-weight:600;line-height:1.25;color:#0A1626">Reduce dependence on single markets</p></div></div><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#0B7FA0;margin-top:12px">FOR RUSSIA</p><p style="font-size:30px;line-height:1.4;color:#0A1626">Asian and Middle Eastern partners · technological independence · digital tools and efficiency</p></div><div data-build-in="pop order 1" style="width:540px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;background:#06101C;padding:42px;border-radius:26px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#FFB21E">TO SUM UP</p><p style="font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;font-size:36px;font-weight:800;line-height:1.2;color:#E9F1F8">Reliable supplies, stability and control over infrastructure now matter as much as climate goals</p><p style="font-size:27px;line-height:1.4;color:#8EA5BD">Our task: watch the market closely and <span style="color:#2ED3F0">adapt our strategy in advance</span></p></div></div>
<aside>[Speaker 4] Finally, what does all this mean for the energy sector and for us in particular? The main conclusion is that the competitiveness of energy companies is now determined not only by production volumes and resource prices, but also by their ability to adapt quickly to changes in the international environment. For the oil and gas sector, the most important priorities include diversifying export destinations, developing LNG transportation infrastructure, creating new logistics routes and reducing dependence on individual markets. For Russia, this means strengthening cooperation with Asian and Middle Eastern partners, as well as maintaining technological independence. Furthermore, we cannot ignore the development of digital technologies and improvements in the efficiency of energy production and transportation. To sum up, the summit has demonstrated that the global energy sector is entering a period in which reliable supplies, geopolitical stability and control over infrastructure are becoming just as important as environmental objectives. Therefore, our task is to closely monitor changes in the international energy market and adapt our strategy to new conditions in advance.</aside>
</section>

const FB='https://arabic-819da-default-rtdb.firebaseio.com',PATH=FB+'/config/prezent_energy';
const tpl=document.getElementById('slides').content;
const SL=[...tpl.querySelectorAll('section')];
const N=SL.length;
const CLICKS=SL.map(s=>[...s.querySelectorAll('[data-build-in]')].filter(el=>!/\bauto\b/.test(el.getAttribute('data-build-in'))).length+s.querySelectorAll('[data-step]').length);
const $=id=>document.getElementById(id);
let ST={},off=0,shown=-1;
let ROLE=null;try{ROLE=localStorage.getItem('pz_role_energy')}catch(e){}
const WHO={"s1": "Speaker 1", "s2": "Speaker 2", "s3": "Speaker 3", "s4": "Speaker 4"};
function setRole(r){ROLE=r;try{localStorage.setItem('pz_role_energy',r)}catch(e){}document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));$('rolepick').classList.remove('show');render()}
const isMine=b=>ROLE==='all'||b.who===WHO[ROLE];
function nextMine(from){for(let i=from;i<SCRIPT.length;i++){if(SCRIPT[i].blocks.some(isMine))return i}return -1}
const first=t=>{const w=t.split(' ');return w.length>12?w.slice(0,12).join(' ')+'…':t};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)}
async function api(path,method,body){const r=await fetch(PATH+path+'.json',{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw new Error('db '+r.status);return r.json()}
async function syncClock(){try{const t0=Date.now();const v=await fetch(FB+'/config/prezent_t.json',{method:'PUT',body:JSON.stringify({'.sv':'timestamp'})}).then(r=>r.json());off=v-(t0+Date.now())/2}catch(e){}}
const alive=()=>ST.owner&&ST.hb&&(Date.now()+off-ST.hb)<25000;
function fitHolder(box,h){const w=box.clientWidth;h.style.transform=`scale(${w/1920})`}
function put(holder,i){holder.innerHTML='';if(i<0||i>=N)return;const c=SL[i].cloneNode(true);c.classList.add('slide');holder.appendChild(c)}
function render(){
  const s=typeof ST.slide==='number'?ST.slide:0,stp=ST.step||0;
  $('pos').textContent=`Слайд ${s+1} / ${N}`+(CLICKS[s]?` · шаг ${stp}/${CLICKS[s]}`:'');
  if(s!==shown){put($('ph'),s);put($('mh'),s+1);shown=s;fit();
    document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('cur',i===s));
    const cc=document.querySelectorAll('.chip')[s];if(cc)cc.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
  $('ptitle').textContent=(SCRIPT[s]||{}).t||'';
  $('nextbox').style.display=s+1<N?'flex':'none';$('ntitle').textContent=(SCRIPT[s+1]||{}).t||'';
  const sc=SCRIPT[s]||{blocks:[]},hasClicks=CLICKS[s]>0;
  const role=ROLE||'all';
  const stOf=i=>!hasClicks?'cur':(i<stp?'done':i===stp?'cur':'later');
  let html='';
  const mineHere=sc.blocks.some(isMine);
  if(role!=='all'&&!mineHere){
    const nm=nextMine(s+1);
    html+=`<div class="wait">Сейчас говорит <b>${sc.blocks.map(b=>b.who).filter((v,i,a)=>a.indexOf(v)===i).join(' и ')}</b>. `+(nm>=0?`Ваш текст начнётся на слайде <b>${nm+1}</b> — «${SCRIPT[nm].t}».`:`Ваш текст на этом выступлении закончился.`)+`</div>`;
  }
  sc.blocks.forEach((b,i)=>{
    const st=stOf(i),w=/Анаст/.test(b.who)?'a':'d';
    if(role==='all'||isMine(b)){
      html+=`<div class="blk ${st}"><span class="who ${w}">${b.who}</span>${b.card?`<span class="card">${b.card}</span>`:''}${role!=='all'&&st==='cur'?'<span class="yours">Ваш текст</span>':''}<p>${b.text}</p>${b.hint&&(st==='cur')?`<div class="hint">${b.hint}</div>`:''}</div>`;
    }else{
      html+=`<div class="other ${st==='cur'?'cur':''}"><b>${b.who}:</b> ${first(b.text)}</div>`;
    }
  });
  if(role!=='all'&&mineHere){
    const myIdx=sc.blocks.map((b,i)=>isMine(b)?i:-1).filter(i=>i>=0);
    const lastMine=myIdx[myIdx.length-1];
    if(!hasClicks||stp>=lastMine){const nm=nextMine(s+1);if(nm!==s+1&&nm>=0&&sc.blocks.length&&isMine(sc.blocks[sc.blocks.length-1]))html+=`<div class="hint" style="margin:4px 4px 10px">После этого слайда говорит коллега. Ваш следующий текст — слайд ${nm+1}.</div>`;
      if(nm<0&&isMine(sc.blocks[sc.blocks.length-1])&&s===N-1)html+='';}
  }
  $('script').innerHTML=html;
  const cur=document.querySelector('.blk.cur');if(cur&&hasClicks)cur.scrollIntoView({block:'nearest',behavior:'smooth'});
  const on=alive();$('dot').className='dot '+(on?'on':'off');
  $('stt').textContent=on?('Открыта: '+(ST.dev||'устройство')):(ST.kicked?'Устройство отключено — откройте на другом':'Презентация не открыта');
  $('reset').disabled=!ST.owner;
  $('bk').disabled=$('fw').disabled=!on;
}
function fit(){fitHolder($('prev'),$('ph'));fitHolder($('mini'),$('mh'))}
addEventListener('resize',fit);
SCRIPT.forEach((s,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=(i+1)+'. '+s.t;b.onclick=()=>send('go',i);$('strip').appendChild(b)});
async function send(a,n){
  if(!alive()){toast('Сначала откройте презентацию на устройстве');return}
  const cmd={id:Math.random().toString(36).slice(2,10)+Date.now().toString(36),a};if(typeof n==='number')cmd.n=n;
  if(navigator.vibrate)navigator.vibrate(15);
  try{await api('/cmd','PUT',cmd)}catch(e){toast('Нет связи с сервером')}
}
document.querySelectorAll('#roles button,#rolepick button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
if(ROLE)setRole(ROLE);else $('rolepick').classList.add('show');
$('fw').onclick=()=>send('next');$('bk').onclick=()=>send('prev');
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();send('next')}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();send('prev')}});
$('reset').onclick=async()=>{if(!ST.owner){toast('Сейчас презентация нигде не открыта');return}if(!confirm('Отключить показ на устройстве «'+(ST.dev||'устройство')+'»? После этого презентацию можно будет открыть на другом.'))return;try{await api('','PATCH',{kicked:ST.owner,owner:null,hb:0});toast('Устройство отключено')}catch(e){toast('Нет связи с сервером')}};
// timer
let t0=null,ti=null;
$('tbtn').onclick=()=>{if(ti){clearInterval(ti);ti=null;t0=null;$('timer').textContent='00:00';$('tbtn').textContent='Старт таймера';return}
  t0=Date.now();$('tbtn').textContent='Сброс';ti=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)};
// sync
function applyEv(path,data){if(path==='/'){ST=data||{};return}const ks=path.split('/').filter(Boolean);let o=ST;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]]}if(data===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=data}
(async()=>{
  await syncClock();
  try{ST=(await api(''))||{}}catch(e){$('stt').textContent='Нет связи с сервером'}
  render();
  let fails=0,poll=null;const startPoll=()=>{if(poll)return;poll=setInterval(async()=>{try{ST=(await api(''))||{};render()}catch(e){$('stt').textContent='Нет связи с сервером'}},1200)};
  try{const es=new EventSource(PATH+'.json');
    es.addEventListener('put',e=>{const d=JSON.parse(e.data);applyEv(d.path,d.data);render()});
    es.addEventListener('patch',e=>{const d=JSON.parse(e.data);for(const k in d.data)applyEv((d.path==='/'?'':d.path)+'/'+k,d.data[k]);render()});
    es.onerror=()=>{if(++fails>3){es.close();startPoll()}};
  }catch(e){startPoll()}
  setInterval(render,5000);
})();
})();
</script>
