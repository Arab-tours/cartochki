<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Калима переехала</title>
<style>
:root{--bg:#f4f1e8;--ink:#14301f;--mute:#5d6b62;--sea:#0f5c3f}
@media (prefers-color-scheme:dark){:root{--bg:#101a14;--ink:#e9efe9;--mute:#a3b0a7;--sea:#3fa577}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:420px}
h1{font-size:26px;margin:0 0 12px}
p{margin:0 0 22px;color:var(--mute)}
a.btn{display:inline-block;padding:15px 26px;border-radius:16px;background:var(--sea);color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.url{display:block;margin-top:14px;color:var(--sea);word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Калима переехала</h1>
<p>Сайт теперь доступен по ссылке:</p>
<a class="btn" href="https://kalima-arabic.ru/">Открыть Калиму</a>
<a class="url" href="https://kalima-arabic.ru/">kalima-arabic.ru</a>
</main>
</body>
</html>
