function teachv(){show("teach");ra();if(DB&&!unsub)try{unsub=DB.collection("progress").onSnapshot(q=>{live={};q.docs.forEach(d=>live[d.id]=d.data());if(!$("teach").hidden)rt()},()=>{})}catch(e){}rt()}
const getS=k=>[live[k],imp()[k],ld("p_"+k),live[OLD[k]],imp()[OLD[k]],ld("p_"+OLD[k])].filter(x=>x&&x.t).sort((a,b)=>b.t.last-a.t.last)[0];
const ago=t=>{if(!t)return"никогда";const d=(Date.now()-t)/864e5;return d<1?"сегодня":Math.floor(d)+" дн. назад"};
const sm=c=>{let r=0,y=0,g=0,k=0;Object.values(c.w||{}).forEach(w=>{w.x>5?k++:w.x>=3?r++:w.x>=1?y++:g++});return{r,y,g,k}};
const cpy=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert("Скопировано"),()=>prompt("Скопируй:",t)):prompt("Скопируй:",t);
function rt(){$("tn").textContent=DB?"Данные учеников приходят автоматически.":"Живой связи нет: добавь код каждого ученика ниже.";
const rows=Object.keys(NAMES).filter(k=>k!==TEACH).map(k=>({k,c:getS(k)})),v=$("ts").value,acc=c=>c&&c.t.n?c.t.ok/c.t.n:-1,bad=c=>c?sm(c).r+sm(c).k:0;
rows.sort((a,b)=>v==="p"?acc(a.c)-acc(b.c):v==="e"?bad(b.c)-bad(a.c):(b.c?b.c.t.last:0)-(a.c?a.c.t.last:0));
const act=rows.filter(r=>r.c&&r.c.t.n),tn=act.reduce((a,r)=>a+r.c.t.n,0),to=act.reduce((a,r)=>a+r.c.t.ok,0),now=Date.now();
const idle=rows.filter(r=>!r.c||!r.c.t.n||now-r.c.t.last>3*864e5).map(r=>NAMES[r.k]);
$("tsum").innerHTML=`<div class="tc"><b>Класс</b><br>Занимались: ${act.length} из ${rows.length} · ответов: ${tn} · верно ${tn?Math.round(to/tn*100):0}% · за сутки: ${act.filter(r=>now-r.c.t.last<864e5).length}${idle.length?`<br>⚠ Не занимались 3+ дня: ${idle.join(", ")}`:""}</div>`;
const ag={};act.forEach(r=>Object.entries(r.c.w||{}).forEach(([a,w])=>ag[a]=(ag[a]||0)+w.x));
const tw=Object.entries(ag).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
$("tk").innerHTML=tw.length?`<div class="tc"><b>Самые сложные слова класса</b><ol>${tw.map(([a,x])=>`<li><span class="ar">${a}</span> — ${IDX[a]||""} <b>×${x}</b></li>`).join("")}</ol></div>`:"";
let h="";rows.forEach(({k,c})=>{if(!c||!c.t.n){h+=`<div class="tc"><b>${NAMES[k]}</b> ⚠ пока ничего не делал</div>`;return}
const s=sm(c),p=Math.round(c.t.ok/c.t.n*100),ws=Object.entries(c.w||{}).filter(e=>e[1].x>0).sort((a,b)=>b[1].x-a[1].x),li=e=>`<li><span class="ar">${e[0]}</span> — ${IDX[e[0]]||""} <b>×${e[1].x}</b></li>`;
h+=`<div class="tc ${s.k?"bk":s.r?"rd":s.y?"yl":"gn"}"><b>${NAMES[k]}</b> ${now-c.t.last>3*864e5?"⚠ ":""}· ${ago(c.t.last)}<br>Ответов: ${c.t.n}, верно ${p}%<div class="bar"><i style="width:${p}%"></i></div>⬛ ${s.k} 🟥 ${s.r} 🟨 ${s.y} 🟩 ${s.g} · в «вьебал»: ${Object.keys(c.m||{}).length}<br><small>${Object.entries(c.c||{}).map(([t,x])=>t+": "+x.n).join(" · ")}</small>${ws.length?"<br>Проблемные слова:<ul>"+ws.slice(0,5).map(li).join("")+"</ul>":""}${ws.length>5?`<details><summary>Все слова с ошибками (${ws.length})</summary><ul>${ws.map(li).join("")}</ul></details>`:""}<button class="lnk" data-k="${k}">Сбросить прогресс</button></div>`});
$("tl").innerHTML=h}
$("ts").onchange=rt;
$("csv").onclick=()=>{const r=[["Имя","Ответов","Верно %","Последний вход","Чёрных","Красных","Жёлтых","Зелёных"]];Object.keys(NAMES).filter(k=>k!==TEACH).forEach(k=>{const c=getS(k);if(!c||!c.t.n){r.push([NAMES[k],0,"","",0,0,0,0]);return}const s=sm(c);r.push([NAMES[k],c.t.n,Math.round(c.t.ok/c.t.n*100),new Date(c.t.last).toLocaleString("ru-RU"),s.k,s.r,s.y,s.g])});cpy(r.map(x=>x.join(";")).join("\n"))};
$("tl").onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k||!confirm("Сбросить прогресс: "+NAMES[k]+"?"))return;try{localStorage.removeItem("p_"+k);const i=imp();delete i[k];localStorage.setItem("imp",JSON.stringify(i))}catch(x){}delete live[k];const z=blank();z.t.last=Date.now();if(DB)try{DB.doc("progress/"+k).set(z).catch(()=>{})}catch(x){}rt()};
$("ib").onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($("ic").value.trim()))));if(!NAMES[d.me]||d.me===TEACH)throw 0;const i=imp();i[d.me]=d;localStorage.setItem("imp",JSON.stringify(i));$("ic").value="";rt()}catch(e){alert("Код не подошёл")}};
$("go").onclick=()=>{let k=$("nm").value.trim().toLowerCase();k=AL[k]||k;if(!NAMES[k]){$("err").textContent="Такого ученика нет";return}$("err").textContent="";login(k)};
$("nm").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
async function login(k){me=k;await Promise.race([dbp,new Promise(r=>setTimeout(r,2500))]);S=ld("p_"+k)||blank();
if(DB&&k!==TEACH)try{const q=await DB.doc("progress/"+k).get();const d=q.exists&&q.data();if(d&&d.t&&d.t.last>S.t.last)S=d}catch(e){}
if(OLD[k]&&!S.t.n){const o=ld("p_"+OLD[k]);if(o&&o.t)S=o;else if(DB)try{const q=await DB.doc("progress/"+OLD[k]).get();if(q.exists&&q.data().t)S=q.data()}catch(e){}}
await loadLocks();S.w=S.w||{};S.c=S.c||{};miss=S.m||(S.m={});try{localStorage.setItem("me",JSON.stringify(k))}catch(e){}
home();k===TEACH?teachv():show("menu")}
function logout(){try{localStorage.removeItem("me")}catch(e){}me=null;S=null;miss={};$("nm").value="";show("login")}
function open(k){cat=cur[k];full=cat.w.slice();start(full)}
function endMsg(big,txt,btns){const e=$("endn");e.textContent=big;e.style.fontSize=btns?"":"30px";$("endt").textContent=txt;$("endrow").hidden=!btns;show("end")}
function win(){endMsg("молодец батракан, иди учи грамматику","",0)}
function openMiss(){cur=C;const w=Object.values(miss);if(!w.length){endMsg("Пока пусто","Нажми «Ещё раз» на любой карточке — слово попадёт сюда.",0);return}
mm=true;cat={t:"Слова, которые вьебал"};deck=w.sort(()=>Math.random()-.5);i=0;know=0;flipped=false;$("ct").textContent=cat.t;show("study");draw()}
function start(list){mm=false;deck=list.slice();i=0;know=0;flipped=false;$("ct").textContent=cat.t;show("study");draw()}
function draw(){
 if(mm&&i>=deck.length){deck=Object.values(miss).sort(()=>Math.random()-.5);i=0;if(!deck.length){win();return}}
 if(i>=deck.length){const m=deck.length-know;$("miss").disabled=!m;endMsg(`${know} из ${deck.length}`,m?`Ещё раз: ${m}`:"Всё знаете!",1);return}
 const d=deck[i],f=$("face");
 const ar=`<div class="big ar">${d.a}</div>`,ru=`<div class="ru">${d.r}</div>`;
 const q=rev?ru:ar,a=rev?ar:ru;
 f.className="face"+(flipped?" ans ":" ")+st(d.a);
 f.innerHTML=flipped?a:q+`<div class="hint">↻</div>`;
 $("pb").style.width=(i/deck.length*100)+"%";
 $("pos").textContent=`${i+1} / ${deck.length}`;$("sc").textContent=mm?`Подряд: ${d.n||0} / 3`:`Знаю: ${know}`;
 $("dir").textContent=rev?"Русский → арабский":"Арабский → русский";
 $("yes").disabled=$("no").disabled=!flipped;
}
const next=ok=>{if(ok)know++;else deck[i].m=1;i++;flipped=false;draw()};
$("face").onclick=()=>{flipped=!flipped;draw()};
$("yes").onclick=()=>{const d=deck[i];d.m=0;rec(d,1);if(mm){d.n=(d.n||0)+1;if(d.n>=3)delete miss[d.a]}save();next(1)};
$("no").onclick=()=>{const d=deck[i];rec(d,0);if(mm)d.n=0;else miss[d.a]={a:d.a,r:d.r,n:0};save();next(0)};
$("dir").onclick=()=>{rev=!rev;flipped=false;draw()};
$("back").onclick=$("back2").onclick=()=>{cur===X?extra():cur===C?s1():home();show("menu")};
$("shuf").onclick=()=>{for(let j=deck.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[deck[j],deck[k]]=[deck[k],deck[j]]}i=0;know=0;flipped=false;draw()};
$("prev").onclick=()=>{if(i>0){i--;flipped=false;draw()}};
$("restart").onclick=()=>mm?openMiss():start(full);
$("again").onclick=()=>start(full);
$("miss").onclick=()=>{const m=deck.filter(d=>d.m);start(m)};
show("login");{const m=ld("me");if(m&&NAMES[m])login(m)}
setInterval(async()=>{if(!me||me===TEACH)return;const o=JSON.stringify(L);await loadLocks();if(o!==JSON.stringify(L)&&!$("menu").hidden)cur===X?extra():cur===C?s1():home()},15000);
</script></body></html>
