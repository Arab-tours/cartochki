<style>
:root{--bg:#0B111C;--card:#141D2E;--line:rgba(242,238,230,.12);--ink:#F2EEE6;--mut:#9AA6BA;--blue:#3D6CC0;--red:#D9412F;--gold:#E8B84A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto 12px}
.st{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;background:#6B7280}
.dot.on{background:#3FB96B;box-shadow:0 0 0 4px rgba(63,185,107,.18)}
.dot.off{background:var(--red)}
.pos{font:600 18px 'Oswald',Arial,sans-serif;letter-spacing:.5px}
.sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px 'Rubik',Arial,sans-serif;padding:9px 13px;border-radius:999px;cursor:pointer;text-decoration:none}

#timer{font:600 16px 'Oswald',Arial,sans-serif;font-variant-numeric:tabular-nums;color:var(--gold)}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
@media(max-width:899px){.grid>.pane:first-child{order:2}.prev{max-width:420px}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.prev{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0F1624}
.prev .holder{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.prevtitle{margin:10px 2px 0;font:600 20px 'Oswald',Arial,sans-serif}
.next{margin-top:12px;display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px}
.next .mini{position:relative;width:120px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;background:#0F1624}
.next .mini .holder{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.who{display:inline-block;font:600 13px 'Rubik',Arial,sans-serif;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.who.a{background:rgba(61,108,192,.22);color:#9DBBF0}
.who.d{background:rgba(217,65,47,.2);color:#F3A497}
.blk{padding:12px 14px;border-radius:14px;border:1px solid transparent;margin-bottom:10px;transition:background .3s,opacity .3s}
.blk p{margin:0;font-size:20px;line-height:1.5}
.blk.cur{background:#1C2840;border-color:rgba(232,184,74,.45)}
.blk.done{opacity:.4}
.blk.later{opacity:.55}
.blk .card{font-size:12px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-left:6px}
.hint{margin-top:6px;font-size:14px;color:var(--mut);font-style:italic}
.strip{max-width:1200px;margin:14px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font:500 13px 'Rubik',Arial,sans-serif;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.cur{background:#2B4E8C;border-color:#2B4E8C}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(11,17,28,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:12px;z-index:10}
.bar button{appearance:none;border:none;border-radius:18px;font:600 22px 'Oswald',Arial,sans-serif;color:#fff;padding:18px 0;cursor:pointer;user-select:none}
.bar .bk{flex:1;background:#2A3448}
.bar .fw{flex:2.2;background:#2B4E8C}
.bar button:active{filter:brightness(1.2);transform:scale(.98)}
.bar button:disabled{opacity:.4}
.slide aside{display:none}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;margin:0;box-sizing:border-box}
.slide *{box-sizing:border-box;margin:0}
.slide div:not([style*="display"]){display:flex;flex-direction:column}
.slide ul{padding-left:1.1em}
.slide b{font-weight:600}
.slide table{border-collapse:collapse;width:100%}
.slide th,.slide td{padding:.45em .6em;text-align:left;vertical-align:top;border-bottom:1px solid rgba(26,34,51,.14)}
.slide img{display:block}
.roles{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.roles button{appearance:none;border:none;background:none;color:var(--mut);font:500 14px 'Rubik',Arial,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.roles button.on{background:#2B4E8C;color:#fff}
.roles button.on.d{background:#B5321F}
.other{padding:10px 14px;border-radius:14px;margin-bottom:10px;border:1px dashed var(--line);color:var(--mut);font-size:15px;line-height:1.45}
.other b{color:var(--ink);font-weight:500}
.other.cur{border-color:rgba(232,184,74,.45);color:#C9D1DE}
.yours{display:inline-block;font:600 12px 'Rubik',Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#0F1624;background:var(--gold);padding:3px 8px;border-radius:6px;margin-left:6px}
.wait{padding:14px;border-radius:14px;background:#1A2234;color:#C9D1DE;font-size:16px;line-height:1.5;margin-bottom:10px}
.wait b{color:var(--ink)}
#rolepick{position:fixed;inset:0;z-index:30;background:rgba(11,17,28,.96);display:none;align-items:center;justify-content:center;padding:20px}
#rolepick.show{display:flex}
#rolepick .box{max-width:420px;width:100%;text-align:center}
#rolepick h2{font:600 26px 'Oswald',Arial,sans-serif;margin:0 0 6px}
#rolepick p{color:var(--mut);margin:0 0 18px}
#rolepick button{display:block;width:100%;appearance:none;border:none;border-radius:16px;padding:18px;margin-bottom:10px;font:600 19px 'Rubik',Arial,sans-serif;color:#fff;cursor:pointer}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2B4E8C;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

<aside>Главный вопрос: где заканчивается система и начинается человек. Первая часть — про рамку (президентская система, партия, Конгресс, суды, федерализм), вторая — про то, что Трамп привносит сам: стиль, популизм, связь с электоратом.</aside>

<p style="position:absolute;left:128px;top:52px;width:1400px;font-size:24px;letter-spacing:1px;color:#5A6578"><span style="color:#5A6578">Вопрос</span> <span style="color:#A7AFBD">→</span> <span style="color:#B5321F"><b>Институты</b></span> <span style="color:#A7AFBD">→</span> <span style="color:#5A6578">Сдержка на деле</span> <span style="color:#A7AFBD">→</span> <span style="color:#5A6578">Стиль</span> <span style="color:#A7AFBD">→</span> <span style="color:#5A6578">Поддержка</span> <span style="color:#A7AFBD">→</span> <span style="color:#5A6578">Сравнение</span> <span style="color:#A7AFBD">→</span> <span style="color:#5A6578">Выводы</span></p>

<p style="font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:500;line-height:1.25;color:#F2EEE6">Каждый канал — и рычаг, и тормоз. Работает ли тормоз?</p>
