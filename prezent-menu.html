<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B111C">
<title>Доклады</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;600&family=Rubik+Dirt&family=Unbounded:wght@700;800&display=swap">
<style>
:root{--bg:#0B111C;--ink:#F2EEE6;--mut:#9AA6BA;--line:rgba(242,238,230,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',Arial,sans-serif}
body{min-height:100vh;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{color:var(--ink);text-decoration:none;font-size:14px;border:1px solid var(--line);padding:9px 14px;border-radius:999px}
.mode{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#E8B84A}
h1{font:700 clamp(40px,7vw,72px)/1 'Oswald',Arial,sans-serif;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
a.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:360px;border-radius:22px;overflow:hidden;text-decoration:none;color:var(--ink);background:#141D2E;isolation:isolate;transition:transform .15s ease,box-shadow .15s ease}
a.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s ease}
a.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.88) 100%)}
a.card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(0,0,0,.45)}
a.card:hover img{transform:scale(1.04)}
a.card:focus-visible{outline:3px solid #E8B84A;outline-offset:3px}
.in{padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.num{font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.t{margin:0}
.trump .num{color:#9DB6E6}.trump .t{font:700 34px/1.05 'Oswald',Arial,sans-serif}
.kartel{background:#141010}.kartel .num{color:#FF4FA8}.kartel .t{font:400 38px/1 'Rubik Dirt','Oswald',Impact,sans-serif}
.who{font-size:15px;color:#D4D9E2}
.go{align-self:flex-start;margin-top:6px;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px}
.trump .go{background:#2B4E8C}.kartel .go{background:#E5007D}
@media (prefers-reduced-motion:reduce){a.card,a.card img{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="./">← Карточки</a><span class="mode" id="mode">Выбор доклада</span></div>
  <h1 id="h">Какой доклад открыть?</h1>
  <div class="grid">
    <a class="card trump" id="c1" href="prezent.html">
      <img src="prezent-trump.jpg" alt="">
      <div class="in"><span class="num">Доклад 01</span><h2 class="t">Трамп: институты против личности</h2><span class="who">Ханова Анастасия · Тучнин Дмитрий</span><span class="go" id="g1">Открыть →</span></div>
    </a>
    <a class="card kartel" id="c2" href="prezent-kartel.html">
      <img src="prezent-kartel.jpg" alt="">
      <div class="in"><span class="num">Доклад 02</span><h2 class="t">Картели: Медельин и Лос-Сетас</h2><span class="who">Тучнин Дмитрий · Рыбаков Егор</span><span class="go" id="g2">Открыть →</span></div>
    </a>
  </div>
</div>
<script>
if(new URLSearchParams(location.search).get('panel')){
  document.getElementById('c1').href='prezent-panel.html';
  document.getElementById('c2').href='prezent-kartel-panel.html';
  document.getElementById('mode').textContent='Пульт докладчика';
  document.getElementById('h').textContent='Пульт какого доклада открыть?';
  document.getElementById('g1').textContent=document.getElementById('g2').textContent='Открыть пульт →';
}
</script>
</body>
</html>
