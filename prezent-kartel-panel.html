<aside>[Тучнин Дмитрий] Наш вопрос: как картель превращает насилие в политическое влияние и почему два картеля делали это по-разному. Опираемся на три работы. Чарльз Тилли (1985) показал, что ранние государства сами вели себя как организованная преступность: продавали защиту и монополизировали насилие — картель в этом смысле конкурент государства. Бенджамин Лессинг («Making Peace in Drug Wars», 2017) различает две логики конфликта картеля с государством: «насильственное лоббирование» — террор, чтобы изменить политику страны, и «насильственную коррупцию» — силу как аргумент на переговорах о взятках. Анхелика Дуран-Мартинес (2018) сравнивает Колумбию и Мексику и показывает, что заметность насилия зависит от того, насколько едино государство и как оно относится к преступному рынку. Наша гипотеза: Медельин — это прежде всего лоббирование, Сетас — коррупция.</aside>

<aside>[Тучнин Дмитрий] Медельинский картель сложился в конце 1970-х — начале 1980-х вокруг Пабло Эскобара, братьев Очоа, Карлоса Ледера и Гонсало Родригеса Гачи. По сути это была экспортная корпорация: она закупала кокаиновую пасту в Перу и Боливии, перерабатывала её в лабораториях в Колумбии и самолётами доставляла в США. Это был союз крупных предпринимателей, которые нанимали киллеров (сикариев), а не военная организация. Против картеля действовали государство, конкуренты из Кали, а в 1993 году — группировка «Лос Пепес». Ледера выдали США в 1987 году, Эскобар был убит 2 декабря 1993 года. Ключевое для нашей темы: главной угрозой для этих людей был не конкурент, а договор об экстрадиции с США 1979 года. Именно вокруг него и выстроилась вся политика картеля.</aside>

<h2 style="font-family:'Unbounded', Arial, sans-serif;font-size:60px;font-weight:800;line-height:1.1;color:#141010">Четыре способа давить на государство</h2>
<div style="display:flex;flex-direction:row;gap:28px"><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#141010">1982</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Выборы</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Эскобар избран заместителем депутата Палаты представителей; в 1983-м лишён иммунитета</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#141010">1982</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Популизм</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Дома для бедняков, футбольные поля, освещение — образ «Робин Гуда» в трущобах</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#C1121F">1984–89</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Террор</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Убиты министр юстиции Лара Бонилья и кандидат в президенты Галан; взорван самолёт Avianca</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#C1121F">1991</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Сделка</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Новая Конституция запрещает выдачу граждан; Эскобар сдаётся в тот же день</p></div></div>
<p style="font-family:'Unbounded', Arial, sans-serif;font-size:30px;font-weight:700;line-height:1.3;color:#141010">Сначала — стать частью системы. Не вышло — бить по ней силой</p>
<p style="position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B5E50">El Espectador (2019); Slate (2015); Avianca 203 — приговор суда США, 1994</p>
<aside>[Тучнин Дмитрий] У картеля было четыре инструмента. Первый — выборы. В 1982 году Эскобар избран заместителем (suplente) депутата Палаты представителей по либеральному списку. Луис Карлос Галан публично отмежевался от него и исключил этот список из своего движения, а министр юстиции Родриго Лара Бонилья добился снятия с Эскобара иммунитета — в 1983 году он ушёл из Конгресса. Второй — популизм: в бедных районах Медельина картель строил дома (район Моравия, позже «барио Пабло Эскобар»), футбольные поля, освещение. Это давало базу поддержки и защиту: в этих кварталах его укрывали. Третий — террор. Когда легальный путь закрылся, группа «Лос Экстрадитаблес» объявила войну государству под лозунгом, что лучше могила в Колумбии, чем тюрьма в США. В апреле 1984 года убит Лара Бонилья, 18 августа 1989 года — кандидат в президенты Галан. 27 ноября 1989 года взорван рейс Avianca 203: погибли все 107 человек на борту и трое на земле; целью был кандидат Сесар Гавирия, которого в самолёте не было. Четвёртый — сделка: в 1991 году государство пошло на переговоры о сдаче.</aside>

<p style="position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#4A3606">Конституция Колумбии 1991, ст. 35 · El Espectador, «Las obsesiones de la extradición» (2019)</p>
<aside>[Тучнин Дмитрий] Ключевая дата — 19 июня 1991 года. Конституционное собрание вписывает в новую Конституцию запрет на экстрадицию колумбийцев по рождению (статья 35), и в тот же день Эскобар сдаётся и садится в тюрьму «Ла Катедраль», построенную на его условиях. Это лучший пример того, что Лессинг называет насильственным лоббированием: картель не покупает отдельного чиновника, а терроризирует всё общество, чтобы изменить национальную политику. Тактически это сработало. Но стратегически — нет: в июле 1992 года Эскобар бежал, когда его хотели перевести в обычную тюрьму, в декабре 1993 года был убит, а в конце 1997 года конституционная реформа вернула экстрадицию. Такое насилие сплотило против картеля государство, конкурентов и США.</aside>

<h2 style="font-family:'Unbounded', Arial, sans-serif;font-size:60px;font-weight:800;line-height:1.1;color:#141010">Медельин сегодня: та же дилемма</h2>
<div style="display:flex;flex-direction:row;gap:28px"><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:44px;line-height:1;color:#141010">2023–26</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Мир с бандами</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Правительство Петро ведёт переговоры «городского мира» с главарями банд Медельина в тюрьме Итагуи</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:44px;line-height:1;color:#C1121F">АПР 2026</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Скандал</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Концерт звезды прямо в тюрьме «Ла Пас»: привилегии главарей проверяют прокуратура и надзор</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:44px;line-height:1;color:#141010">7 АВГ 2026</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Перелом</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Новый президент Абелардо де ла Эсприелья в первый же день развозит главарей по тюрьмам строгого режима</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:44px;line-height:1;color:#C1121F">АВГ 2026</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Выдача</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Первые указы о выдаче, в том числе в США; Колумбия входит в антикартельную коалицию Трампа</p></div></div>

<p style="position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B5E50">Infobae, Cambio, Vanguardia (авг. 2026); AP — итоги выборов 21 июня 2026; The Star — «Щит Америк», сент. 2026</p>
<aside>[Тучнин Дмитрий] Как это выглядит сегодня. Медельин давно не столица одного картеля, но дилемма 1991 года вернулась. Правительство Густаво Петро в рамках политики «тотального мира» вело переговоры «городского мира» с главарями банд Медельина и долины Абуррá, которые сидели в тюрьме «Ла Пас» в Итагуи. В апреле 2026 года в этой тюрьме прошёл концерт известного певца — привилегии заключённых сейчас проверяют прокуратура и надзорные органы. 21 июня 2026 года президентские выборы с минимальным отрывом, около одного процентного пункта, выиграл Абелардо де ла Эсприелья, которого поддержал Трамп; его соперником был левый сенатор Иван Сепеда. 7 августа, в день вступления в должность, новый президент приказал вывезти более ста заключённых из Итагуи, в том числе участников переговоров, по тюрьмам строгого режима, и вскоре подписал первые указы об экстрадиции, в том числе в США. В сентябре Колумбия вошла в антикартельную коалицию Трампа «Щит Америк». Параллель с «Ла Катедраль» прямая: государство снова выбирает между сделкой с преступниками и выдачей их США.</aside>

<aside>[Рыбаков Егор] Лос-Сетас появились в конце 1990-х. Лидер Картеля Залива Осиэль Карденас Гильен завербовал группу дезертиров из армейского спецназа GAFE во главе с лейтенантом Артуро Гусманом Десеной («Z-1»). Они стали боевым крылом картеля и охраняли ключевой пограничный город Нуэво-Ларедо. После ареста Карденаса в 2003 году Сетас под руководством Эриберто Ласкано постепенно обособились, а в 2010 году окончательно порвали с Картелем Залива и начали с ним войну. Главное отличие от Медельина — бизнес-модель. Сетас зарабатывали не только на наркотиках: вымогательство, похищения, торговля мигрантами — всё, что можно взять с подконтрольной территории. В 2012 году Ласкано убит в перестрелке с морской пехотой, в 2013 году арестован Мигель Анхель Тревиньо (Z-40), после чего организация распалась на фракции, крупнейшая из которых — Картель Северо-Востока.</aside>

<h2 style="font-family:'Unbounded', Arial, sans-serif;font-size:60px;font-weight:800;line-height:1.1;color:#141010">Четыре способа купить власть на местах</h2>
<div style="display:flex;flex-direction:row;gap:28px"><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#B8005F">ПОЛИЦИЯ</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Силовики</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Местная полиция встроена в иерархию: шефы подчинялись «боссам площадки»</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#B8005F">ШТАТ</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Губернаторы</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Свидетели в судах Техаса — о миллионных платежах губернаторам Коауилы; те всё отрицают</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#141010">НАЛОГ</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight:700;line-height:1.2;color:#141010">Рента</h3><p style="font-size:26px;line-height:1.4;color:#3A2E26">Плата «за защиту» с бизнеса — параллельный налог там, где государство слабо</p></div><div style="flex:1;display:flex;flex-direction:column;gap:14px;background:#FBF5EA;padding:32px;border:3px solid #141010;box-shadow:10px 10px 0px #141010"><p style="font-family:'Rubik Dirt', Impact, sans-serif;font-size:64px;line-height:1;color:#C1121F">СТРАХ</p><h3 style="font-family:'Unbounded', Arial, sans-serif;font-size:28px;font-weight <p style="font-family:'Unbounded', Arial, sans-serif;font-size:30px;font-weight:700;line-height:1.3;color:#141010">Не изменить закон, а сделать так, чтобы его некому было применять</p>
<p style="position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#6B5E50">UT Austin, Human Rights Clinic (2017) — по показаниям в судах США; InSight Crime</p>
<aside>[Рыбаков Егор] У Сетас тоже четыре инструмента, но все они работают на уровне штатов и муниципалитетов. Первый — силовики. По показаниям свидетелей на федеральных процессах в Сан-Антонио, Остине и Дель-Рио (их собрала клиника по правам человека Техасского университета в 2017 году), в Коауиле местная полиция фактически входила в иерархию Сетас: начальники полиции отчитывались перед «боссами площадки», задерживали людей для картеля и передавали информацию. Второй — власть штата. Те же свидетели говорили о многомиллионных наличных платежах бывшему губернатору Коауилы Умберто Морейре; сам Морейра называет это фантазиями, и в суде это не доказано — подчеркнём, это именно показания. Для сравнения, бывший губернатор соседнего Тамаулипаса Томас Яррингтон (1999–2005), где тогда хозяйничал Картель Залива с Сетас как его боевым крылом, в 2023 году получил в США девять лет за отмывание денег. Третий — рента: вымогательство «за защиту» с бизнеса, по сути параллельный налог. Четвёртый — показательный террор: в августе 2010 года в Сан-Фернандо (Тамаулипас) убиты 72 мигранта. Цель всего этого — не изменить закон, а сделать так, чтобы его некому было применять.</aside>

<aside>[Рыбаков Егор] Самый страшный пример — Альенде и Пьедрас-Неграс в штате Коауила, март–апрель 2011 года. После того как несколько бывших членов Сетас начали сотрудничать с американскими властями, картель устроил расправу: по показаниям свидетелей на процессах в США, убиты или пропали без вести более 300 человек, включая родственников и людей, вообще не связанных с картелем. Оценки числа жертв расходятся, поэтому мы приводим цифру именно как показания. Для нашей темы важна роль государства: по тем же показаниям, местная полиция задерживала людей для картеля, а семьям, которые пытались подать жалобы, советовали уехать. Это и есть «насильственная коррупция» по Лессингу: насилие направлено не против государства в целом, а служит тому, чтобы местные чиновники брали деньги и не сопротивлялись — принцип «серебро или свинец».</aside>

<aside>[Рыбаков Егор] Сетас как единой организации больше нет, но их модель живёт. Крупнейший осколок — Картель Северо-Востока, его по-прежнему связывают с братьями Тревиньо. В феврале 2025 года под давлением Трампа Мексика передала США 29 заключённых, среди них Мигеля Анхеля Тревиньо (Z-40) и Омара Тревиньо (Z-42). В том же феврале Госдепартамент признал Картель Северо-Востока, Картель Залива и ещё шесть группировок иностранными террористическими организациями. 13 октября 2026 года Минфин США ввёл санкции против четырёх человек и одиннадцати компаний этого картеля — в скачках, строительстве, грузоперевозках, нефти и газе. По данным СМИ, речь идёт об ипподроме под Нуэво-Ларедо и покупке лошадей в США — та же схема, за которую в 2013 году в Техасе судили Хосе Тревиньо. И политическое измерение: по подсчётам мексиканских СМИ, с октября 2024 года, когда к власти пришла Клаудия Шейнбаум, убиты не меньше 13 мэров (разные издания дают 13–14). Логика «насильственной коррупции» на местах никуда не делась.</aside>

<aside>[Тучнин Дмитрий] При всех различиях у картелей три общие черты. Первая — логика «plata o plomo», «серебро или свинец»: подкуп и насилие — не две разные стратегии, а одна, потому что отказ от взятки наказывается. Вторая — США как третий участник: для Медельина главной угрозой был договор об экстрадиции, Сетас судили и разоблачали в американских судах, а в феврале 2025 года Госдепартамент признал иностранными террористическими организациями восемь группировок, в том числе Картель Северо-Востока, крупнейший осколок Сетас, и Картель Залива. Третья — стратегия «обезглавливания»: устранение лидеров разрушило обе организации, но не сам рынок — место Медельина заняли другие группы, а Сетас распались на фракции. Главное различие — в адресате давления: Медельин давил на центральную власть, Сетас покупали власть на местах.</aside>

<aside>[Тучнин Дмитрий] Главная новая тема 2025–2026 годов — США перешли от экстрадиций к силе. В феврале 2025 года восемь группировок, в том числе Картель Северо-Востока и Картель Залива, признаны иностранными террористическими организациями. С 2 сентября 2025 года американские военные бьют по лодкам предполагаемых наркоторговцев в Карибском море и восточной части Тихого океана; по подсчёту InSight Crime, к 4 октября 2026 года — 79 ударов и 238 погибших. В январе 2026 года операция США в Венесуэле закончилась захватом Николаса Мадуро, после чего Трамп заявил, что начнёт бить по картелям «по земле», имея в виду Мексику. 22 февраля 2026 года мексиканский спецназ при разведывательной поддержке США убил Немесио Осегеру, «Эль Менчо», главу Картеля Халиско «Новое поколение»; в ответ картель перекрыл дороги во многих штатах. В сентябре 2026 года на Генассамблее ООН Трамп пообещал использовать против картелей «непревзойдённую военную мощь» и собрал коалицию «Щит Америк»: Колумбия в неё вошла, Мексика — нет, Шейнбаум отвергает американское военное вмешательство и предлагает координацию. Для нашей темы это значит: картели снова стали вопросом внешней политики и суверенитета, как Медельин в 1980-е.</aside>

<p style="position:absolute;left:128px;bottom:56px;width:1664px;font-size:24px;color:#CFC3AE">Источники: Tilly (1985); Lessing (2017); Durán-Martínez (2018); El Espectador; InSight Crime; UT Austin HRC (2017); Госдеп США (2025)</p>
<aside>[Тучнин Дмитрий] Три вывода. Первый: Медельинский картель воевал с законом — он хотел изменить национальную политику экстрадиции и добился этого в 1991 году, тогда как Сетас не трогали закон, а покупали и запугивали тех, кто его применяет. Второй: форма политического влияния определяется тем, где принимается главное для картеля решение. Экстрадицию решали в Боготе — поэтому Медельин бил по центру. Безопасность рынка в Мексике во многом решается на уровне штатов и муниципалитетов — поэтому Сетас захватывали местную власть, и их наследники делают это до сих пор. Третий, открытый вопрос 2026 года: США сделали ставку на силу — удары по лодкам, террористические списки, давление на Мексику и Колумбию. Но опыт обоих картелей показывает, что ликвидация лидеров разрушает организацию, а не рынок. Победит ли сила извне, если не победить коррупцию на местах? Спасибо за внимание, готовы ответить на вопросы.</aside>

<script>
(function(){
const SCRIPT=[{"t": "Титульный слайд", "blocks": [{"who": "Дмитрий", "text": "Добрый день. Наш доклад — о двух самых известных картелях Латинской Америки: колумбийском Медельинском картеле Пабло Эскобара и мексиканском Лос-Сетас."}, {"who": "Дмитрий", "text": "Нас интересует не криминальная хроника, а политика: как преступная организация получает влияние на государство, какими способами, и почему у двух картелей эти способы оказались очень разными."}]}, {"t": "Как картель превращает насилие в политическое влияние — и почему Медельин и Сетас делали это по-разному?", "blocks": [{"who": "Дмитрий", "text": "Наш вопрос: как картель превращает насилие в политическое влияние и почему два картеля делали это по-разному. Опираемся на три работы."}, {"who": "Дмитрий", "text": "Чарльз Тилли (1985) показал, что ранние государства сами вели себя как организованная преступность: продавали защиту и монополизировали насилие — картель в этом смысле конкурент государства."}, {"who": "Дмитрий", "text": "Бенджамин Лессинг («Making Peace in Drug Wars», 2017) различает две логики конфликта картеля с государством: «насильственное лоббирование» — террор, чтобы изменить политику страны, и «насильственную коррупцию» — силу как аргумент на переговорах о взятках."}, {"who": "Дмитрий", "text": "Анхелика Дуран-Мартинес (2018) сравнивает Колумбию и Мексику и показывает, что заметность насилия зависит от того, насколько едино государство и как оно относится к преступному рынку. Наша гипотеза: Медельин — это прежде всего лоббирование, Сетас — коррупция."}]}, {"t": "МЕДЕЛЬИНСКИЙ КАРТЕЛЬ", "blocks": [{"who": "Дмитрий", "text": "Первая часть — Медельинский картель: кто это был и какими способами он пытался влиять на колумбийское государство."}]}, {"t": "Медельин: экспортная корпорация", "blocks": [{"who": "Дмитрий", "text": "Медельинский картель сложился в конце 1970-х — начале 1980-х вокруг Пабло Эскобара, братьев Очоа, Карлоса Ледера и Гонсало Родригеса Гачи. По сути это была экспортная корпорация: она закупала кокаиновую пасту в Перу и Боливии, перерабатывала её в лабораториях в Колумбии и самолётами доставляла в США."}, {"who": "Дмитрий", "text": "Это был союз крупных предпринимателей, которые нанимали киллеров (сикариев), а не военная организация. Против картеля действовали государство, конкуренты из Кали, а в 1993 году — группировка «Лос Пепес». Ледера выдали США в 1987 году, Эскобар был убит 2 декабря 1993 года."}, {"who": "Дмитрий", "text": "Ключевое для нашей темы: главной угрозой для этих людей был не конкурент, а договор об экстрадиции с США 1979 года. Именно вокруг него и выстроилась вся политика картеля."}]}, {"t": "Четыре способа давить на государство", "blocks": [{"who": "Дмитрий", "text": "У картеля было четыре инструмента. Первый — выборы. В 1982 году Эскобар избран заместителем (suplente) депутата Палаты представителей по либеральному списку."}, {"who": "Дмитрий", "text": "Луис Карлос Галан публично отмежевался от него и исключил этот список из своего движения, а министр юстиции Родриго Лара Бонилья добился снятия с Эскобара иммунитета — в 1983 году он ушёл из Конгресса."}, {"who": "Дмитрий", "text": "Второй — популизм: в бедных районах Медельина картель строил дома (район Моравия, позже «барио Пабло Эскобар»), футбольные поля, освещение. Это давало базу поддержки и защиту: в этих кварталах его укрывали. Третий — террор."}, {"who": "Дмитрий", "text": "Когда легальный путь закрылся, группа «Лос Экстрадитаблес» объявила войну государству под лозунгом, что лучше могила в Колумбии, чем тюрьма в США. В апреле 1984 года убит Лара Бонилья, 18 августа 1989 года — кандидат в президенты Галан."}, {"who": "Дмитрий", "text": "27 ноября 1989 года взорван рейс Avianca 203: погибли все 107 человек на борту и трое на земле; целью был кандидат Сесар Гавирия, которого в самолёте не было. Четвёртый — сделка: в 1991 году государство пошло на переговоры о сдаче."}]}, {"t": "Террор сработал: Конституция запретила экстрадицию", "blocks": [{"who": "Дмитрий", "text": "Ключевая дата — 19 июня 1991 года. Конституционное собрание вписывает в новую Конституцию запрет на экстрадицию колумбийцев по рождению (статья 35), и в тот же день Эскобар сдаётся и садится в тюрьму «Ла Катедраль», построенную на его условиях."}, {"who": "Дмитрий", "text": "Это лучший пример того, что Лессинг называет насильственным лоббированием: картель не покупает отдельного чиновника, а терроризирует всё общество, чтобы изменить национальную политику. Тактически это сработало."}, {"who": "Дмитрий", "text": "Но стратегически — нет: в июле 1992 года Эскобар бежал, когда его хотели перевести в обычную тюрьму, в декабре 1993 года был убит, а в конце 1997 года конституционная реформа вернула экстрадицию. Такое насилие сплотило против картеля государство, конкурентов и США."}]}, {"t": "Медельин сегодня: та же дилемма", "blocks": [{"who": "Дмитрий", "text": "Как это выглядит сегодня. Медельин давно не столица одного картеля, но дилемма 1991 года вернулась. Правительство Густаво Петро в рамках политики «тотального мира» вело переговоры «городского мира» с главарями банд Медельина и долины Абуррá, которые сидели в тюрьме «Ла Пас» в Итагуи."}, {"who": "Дмитрий", "text": "В апреле 2026 года в этой тюрьме прошёл концерт известного певца — привилегии заключённых сейчас проверяют прокуратура и надзорные органы."}, {"who": "Дмитрий", "text": "21 июня 2026 года президентские выборы с минимальным отрывом, около одного процентного пункта, выиграл Абелардо де ла Эсприелья, которого поддержал Трамп; его соперником был левый сенатор Иван Сепеда."}, {"who": "Дмитрий", "text": "7 августа, в день вступления в должность, новый президент приказал вывезти более ста заключённых из Итагуи, в том числе участников переговоров, по тюрьмам строгого режима, и вскоре подписал первые указы об экстрадиции, в том числе в США. В сентябре Колумбия вошла в антикартельную коалицию Трампа «Щит Америк»."}, {"who": "Дмитрий", "text": "Параллель с «Ла Катедраль» прямая: государство снова выбирает между сделкой с преступниками и выдачей их США."}]}, {"t": "ЛОС-СЕТАС", "blocks": [{"who": "Егор", "text": "Вторая часть — Лос-Сетас. Если Медельин пытался изменить политику страны, то Сетас действовали совсем иначе: они захватывали власть на местах."}]}, {"t": "Сетас: армия, ставшая картелем", "blocks": [{"who": "Егор", "text": "Лос-Сетас появились в конце 1990-х. Лидер Картеля Залива Осиэль Карденас Гильен завербовал группу дезертиров из армейского спецназа GAFE во главе с лейтенантом Артуро Гусманом Десеной («Z-1»). Они стали боевым крылом картеля и охраняли ключевой пограничный город Нуэво-Ларедо."}, {"who": "Егор", "text": "После ареста Карденаса в 2003 году Сетас под руководством Эриберто Ласкано постепенно обособились, а в 2010 году окончательно порвали с Картелем Залива и начали с ним войну. Главное отличие от Медельина — бизнес-модель."}, {"who": "Егор", "text": "Сетас зарабатывали не только на наркотиках: вымогательство, похищения, торговля мигрантами — всё, что можно взять с подконтрольной территории."}, {"who": "Егор", "text": "В 2012 году Ласкано убит в перестрелке с морской пехотой, в 2013 году арестован Мигель Анхель Тревиньо (Z-40), после чего организация распалась на фракции, крупнейшая из которых — Картель Северо-Востока."}]}, {"t": "Четыре способа купить власть на местах", "blocks": [{"who": "Егор", "text": "У Сетас тоже четыре инструмента, но все они работают на уровне штатов и муниципалитетов. Первый — силовики."}, {"who": "Егор", "text": "По показаниям свидетелей на федеральных процессах в Сан-Антонио, Остине и Дель-Рио (их собрала клиника по правам человека Техасского университета в 2017 году), в Коауиле местная полиция фактически входила в иерархию Сетас: начальники полиции отчитывались перед «боссами площадки», задерживали людей для картеля и передавали информацию."}, {"who": "Егор", "text": "Второй — власть штата. Те же свидетели говорили о многомиллионных наличных платежах бывшему губернатору Коауилы Умберто Морейре; сам Морейра называет это фантазиями, и в суде это не доказано — подчеркнём, это именно показания."}, {"who": "Егор", "text": "Для сравнения, бывший губернатор соседнего Тамаулипаса Томас Яррингтон (1999–2005), где тогда хозяйничал Картель Залива с Сетас как его боевым крылом, в 2023 году получил в США девять лет за отмывание денег. Третий — рента: вымогательство «за защиту» с бизнеса, по сути параллельный налог."}, {"who": "Егор", "text": "Четвёртый — показательный террор: в августе 2010 года в Сан-Фернандо (Тамаулипас) убиты 72 мигранта. Цель всего этого — не изменить закон, а сделать так, чтобы его некому было применять."}]}, {"t": "Полиция не мешала, а помогала", "blocks": [{"who": "Егор", "text": "Самый страшный пример — Альенде и Пьедрас-Неграс в штате Коауила, март–апрель 2011 года."}, {"who": "Егор", "text": "После того как несколько бывших членов Сетас начали сотрудничать с американскими властями, картель устроил расправу: по показаниям свидетелей на процессах в США, убиты или пропали без вести более 300 человек, включая родственников и людей, вообще не связанных с картелем."}, {"who": "Егор", "text": "Оценки числа жертв расходятся, поэтому мы приводим цифру именно как показания. Для нашей темы важна роль государства: по тем же показаниям, местная полиция задерживала людей для картеля, а семьям, которые пытались подать жалобы, советовали уехать."}, {"who": "Егор", "text": "Это и есть «насильственная коррупция» по Лессингу: насилие направлено не против государства в целом, а служит тому, чтобы местные чиновники брали деньги и не сопротивлялись — принцип «серебро или свинец»."}]}, {"t": "Сетас сегодня: Картель Северо-Востока", "blocks": [{"who": "Егор", "text": "Сетас как единой организации больше нет, но их модель живёт. Крупнейший осколок — Картель Северо-Востока, его по-прежнему связывают с братьями Тревиньо. В феврале 2025 года под давлением Трампа Мексика передала США 29 заключённых, среди них Мигеля Анхеля Тревиньо (Z-40) и Омара Тревиньо (Z-42)."}, {"who": "Егор", "text": "В том же феврале Госдепартамент признал Картель Северо-Востока, Картель Залива и ещё шесть группировок иностранными террористическими организациями. 13 октября 2026 года Минфин США ввёл санкции против четырёх человек и одиннадцати компаний этого картеля — в скачках, строительстве, грузоперевозках, нефти и газе."}, {"who": "Егор", "text": "По данным СМИ, речь идёт об ипподроме под Нуэво-Ларедо и покупке лошадей в США — та же схема, за которую в 2013 году в Техасе судили Хосе Тревиньо. И политическое измерение: по подсчётам мексиканских СМИ, с октября 2024 года, когда к власти пришла Клаудия Шейнбаум, убиты не меньше 13 мэров (разные издания дают 13–14)."}, {"who": "Егор", "text": "Логика «насильственной коррупции» на местах никуда не делась."}]}, {"t": "Различия: столица против штата", "blocks": [{"who": "Егор", "text": "Сведём различия в таблицу. Происхождение: Медельин создали торговцы, Сетас — военные. Отсюда доход: у Медельина — экспорт товара в США, у Сетас — рента с подконтрольной территории."}, {"who": "Егор", "text": "Отсюда и цель в политике: Медельину нужно было изменить одну национальную норму — экстрадицию, поэтому он действовал на уровне Конгресса и Конституции. Сетас нужен был контроль над теми, кто применяет закон на месте: полицией, прокурорами, мэрами, администрациями штатов."}, {"who": "Егор", "text": "Различалось и отношение к обществу: Эскобар добивался признания и строил образ благодетеля, Сетас опирались почти только на страх. Итог тоже разный: Медельин добился своего в 1991 году, но был разгромлен к 1993-му; Сетас как единая структура распались после 2013 года, но их фракции действуют до сих пор."}]}, {"t": "Общее: plata o plomo", "blocks": [{"who": "Дмитрий", "text": "При всех различиях у картелей три общие черты. Первая — логика «plata o plomo», «серебро или свинец»: подкуп и насилие — не две разные стратегии, а одна, потому что отказ от взятки наказывается."}, {"who": "Дмитрий", "text": "Вторая — США как третий участник: для Медельина главной угрозой был договор об экстрадиции, Сетас судили и разоблачали в американских судах, а в феврале 2025 года Госдепартамент признал иностранными террористическими организациями восемь группировок, в том числе Картель Северо-Востока, крупнейший осколок Сетас, и Картель Залива."}, {"who": "Дмитрий", "text": "Третья — стратегия «обезглавливания»: устранение лидеров разрушило обе организации, но не сам рынок — место Медельина заняли другие группы, а Сетас распались на фракции. Главное различие — в адресате давления: Медельин давил на центральную власть, Сетас покупали власть на местах."}]}, {"t": "2025–2026: США воюют с картелями", "blocks": [{"who": "Дмитрий", "text": "Главная новая тема 2025–2026 годов — США перешли от экстрадиций к силе. В феврале 2025 года восемь группировок, в том числе Картель Северо-Востока и Картель Залива, признаны иностранными террористическими организациями."}, {"who": "Дмитрий", "text": "С 2 сентября 2025 года американские военные бьют по лодкам предполагаемых наркоторговцев в Карибском море и восточной части Тихого океана; по подсчёту InSight Crime, к 4 октября 2026 года — 79 ударов и 238 погибших."}, {"who": "Дмитрий", "text": "В январе 2026 года операция США в Венесуэле закончилась захватом Николаса Мадуро, после чего Трамп заявил, что начнёт бить по картелям «по земле», имея в виду Мексику."}, {"who": "Дмитрий", "text": "22 февраля 2026 года мексиканский спецназ при разведывательной поддержке США убил Немесио Осегеру, «Эль Менчо», главу Картеля Халиско «Новое поколение»; в ответ картель перекрыл дороги во многих штатах."}, {"who": "Дмитрий", "text": "В сентябре 2026 года на Генассамблее ООН Трамп пообещал использовать против картелей «непревзойдённую военную мощь» и собрал коалицию «Щит Америк»: Колумбия в неё вошла, Мексика — нет, Шейнбаум отвергает американское военное вмешательство и предлагает координацию."}, {"who": "Дмитрий", "text": "Для нашей темы это значит: картели снова стали вопросом внешней политики и суверенитета, как Медельин в 1980-е."}]}, {"t": "Выводы", "blocks": [{"who": "Дмитрий", "text": "Три вывода. Первый: Медельинский картель воевал с законом — он хотел изменить национальную политику экстрадиции и добился этого в 1991 году, тогда как Сетас не трогали закон, а покупали и запугивали тех, кто его применяет."}, {"who": "Дмитрий", "text": "Второй: форма политического влияния определяется тем, где принимается главное для картеля решение. Экстрадицию решали в Боготе — поэтому Медельин бил по центру."}, {"who": "Дмитрий", "text": "Безопасность рынка в Мексике во многом решается на уровне штатов и муниципалитетов — поэтому Сетас захватывали местную власть, и их наследники делают это до сих пор. Третий, открытый вопрос 2026 года: США сделали ставку на силу — удары по лодкам, террористические списки, давление на Мексику и Колумбию."}, {"who": "Дмитрий", "text": "Но опыт обоих картелей показывает, что ликвидация лидеров разрушает организацию, а не рынок. Победит ли сила извне, если не победить коррупцию на местах? Спасибо за внимание, готовы ответить на вопросы."}]}];
const FB='https://arabic-819da-default-rtdb.firebaseio.com',PATH=FB+'/config/prezent_kartel';
const tpl=document.getElementById('slides').content;
const SL=[...tpl.querySelectorAll('section')];
const N=SL.length;
const CLICKS=SL.map(s=>[...s.querySelectorAll('[data-build-in]')].filter(el=>!/\bauto\b/.test(el.getAttribute('data-build-in'))).length+s.querySelectorAll('[data-step]').length);
const $=id=>document.getElementById(id);
let ST={},off=0,shown=-1;
let ROLE=null;try{ROLE=localStorage.getItem('pz_role')}catch(e){}
const WHO={a:'Егор',d:'Дмитрий'};
function setRole(r){ROLE=r;try{localStorage.setItem('pz_role',r)}catch(e){}document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));$('rolepick').classList.remove('show');render()}
const isMine=b=>ROLE==='all'||(ROLE==='a'?/Егор/.test(b.who):/Дмит/.test(b.who));
function nextMine(from){for(let i=from;i<SCRIPT.length;i++){if(SCRIPT[i].blocks.some(isMine))return i}return -1}
const first=t=>{const w=t.split(' ');return w.length>12?w.slice(0,12).join(' ')+'…':t};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)}
async function api(path,method,body){const r=await fetch(PATH+path+'.json',{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw new Error('db '+r.status);return r.json()}
async function syncClock(){try{const t0=Date.now();const v=await fetch(FB+'/config/prezent_t.json',{method:'PUT',body:JSON.stringify({'.sv':'timestamp'})}).then(r=>r.json());off=v-(t0+Date.now())/2}catch(e){}}
const alive=()=>ST.owner&&ST.hb&&(Date.now()+off-ST.hb)<25000;
function fitHolder(box,h){const w=box.clientWidth;h.style.transform=`scale(${w/1920})`}
function put(holder,i){holder.innerHTML='';if(i<0||i>=N)return;const c=SL[i].cloneNode(true);c.classList.add('slide');holder.appendChild(c)}
function render(){
  const s=typeof ST.slide==='number'?ST.slide:0,stp=ST.step||0;
  $('pos').textContent=`Слайд ${s+1} / ${N}`+(CLICKS[s]?` · шаг ${stp}/${CLICKS[s]}`:'');
  if(s!==shown){put($('ph'),s);put($('mh'),s+1);shown=s;fit();
    document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('cur',i===s));
    const cc=document.querySelectorAll('.chip')[s];if(cc)cc.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
  $('ptitle').textContent=(SCRIPT[s]||{}).t||'';
  $('nextbox').style.display=s+1<N?'flex':'none';$('ntitle').textContent=(SCRIPT[s+1]||{}).t||'';
  const sc=SCRIPT[s]||{blocks:[]},hasClicks=CLICKS[s]>0;
  const role=ROLE||'all';
  const stOf=i=>!hasClicks?'cur':(i<stp?'done':i===stp?'cur':'later');
  let html='';
  const mineHere=sc.blocks.some(isMine);
  if(role!=='all'&&!mineHere){
    const nm=nextMine(s+1);
    html+=`<div class="wait">Сейчас говорит <b>${sc.blocks.map(b=>b.who).filter((v,i,a)=>a.indexOf(v)===i).join(' и ')}</b>. `+(nm>=0?`Ваш текст начнётся на слайде <b>${nm+1}</b> — «${SCRIPT[nm].t}».`:`Ваш текст на этом выступлении закончился.`)+`</div>`;
  }
  sc.blocks.forEach((b,i)=>{
    const st=stOf(i),w=/Егор/.test(b.who)?'a':'d';
    if(role==='all'||isMine(b)){
      html+=`<div class="blk ${st}"><span class="who ${w}">${b.who}</span>${b.card?`<span class="card">${b.card}</span>`:''}${role!=='all'&&st==='cur'?'<span class="yours">Ваш текст</span>':''}<p>${b.text}</p>${b.hint&&(st==='cur')?`<div class="hint">${b.hint}</div>`:''}</div>`;
    }else{
      html+=`<div class="other ${st==='cur'?'cur':''}"><b>${b.who}:</b> ${first(b.text)}</div>`;
    }
  });
  if(role!=='all'&&mineHere){
    const myIdx=sc.blocks.map((b,i)=>isMine(b)?i:-1).filter(i=>i>=0);
    const lastMine=myIdx[myIdx.length-1];
    if(!hasClicks||stp>=lastMine){const nm=nextMine(s+1);if(nm!==s+1&&nm>=0&&sc.blocks.length&&isMine(sc.blocks[sc.blocks.length-1]))html+=`<div class="hint" style="margin:4px 4px 10px">После этого слайда говорит коллега. Ваш следующий текст — слайд ${nm+1}.</div>`;
      if(nm<0&&isMine(sc.blocks[sc.blocks.length-1])&&s===N-1)html+='';}
  }
  $('script').innerHTML=html;
  const cur=document.querySelector('.blk.cur');if(cur&&hasClicks)cur.scrollIntoView({block:'nearest',behavior:'smooth'});
  const on=alive();$('dot').className='dot '+(on?'on':'off');
  $('stt').textContent=on?('Открыта: '+(ST.dev||'устройство')):(ST.kicked?'Устройство отключено — откройте на другом':'Презентация не открыта');
  $('reset').disabled=!ST.owner;
  $('bk').disabled=$('fw').disabled=!on;
}
function fit(){fitHolder($('prev'),$('ph'));fitHolder($('mini'),$('mh'))}
addEventListener('resize',fit);
SCRIPT.forEach((s,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=(i+1)+'. '+s.t;b.onclick=()=>send('go',i);$('strip').appendChild(b)});
async function send(a,n){
  if(!alive()){toast('Сначала откройте презентацию на устройстве');return}
  const cmd={id:Math.random().toString(36).slice(2,10)+Date.now().toString(36),a};if(typeof n==='number')cmd.n=n;
  if(navigator.vibrate)navigator.vibrate(15);
  try{await api('/cmd','PUT',cmd)}catch(e){toast('Нет связи с сервером')}
}
document.querySelectorAll('#roles button,#rolepick button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
if(ROLE)setRole(ROLE);else $('rolepick').classList.add('show');
$('fw').onclick=()=>send('next');$('bk').onclick=()=>send('prev');
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();send('next')}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();send('prev')}});
$('reset').onclick=async()=>{if(!ST.owner){toast('Сейчас презентация нигде не открыта');return}if(!confirm('Отключить показ на устройстве «'+(ST.dev||'устройство')+'»? После этого презентацию можно будет открыть на другом.'))return;try{await api('','PATCH',{kicked:ST.owner,owner:null,hb:0});toast('Устройство отключено')}catch(e){toast('Нет связи с сервером')}};
// timer
let t0=null,ti=null;
$('tbtn').onclick=()=>{if(ti){clearInterval(ti);ti=null;t0=null;$('timer').textContent='00:00';$('tbtn').textContent='Старт таймера';return}
  t0=Date.now();$('tbtn').textContent='Сброс';ti=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)};
// sync
function applyEv(path,data){if(path==='/'){ST=data||{};return}const ks=path.split('/').filter(Boolean);let o=ST;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]]}if(data===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=data}
(async()=>{
  await syncClock();
  try{ST=(await api(''))||{}}catch(e){$('stt').textContent='Нет связи с сервером'}
  render();
  let fails=0,poll=null;const startPoll=()=>{if(poll)return;poll=setInterval(async()=>{try{ST=(await api(''))||{};render()}catch(e){$('stt').textContent='Нет связи с сервером'}},1200)};
  try{const es=new EventSource(PATH+'.json');
    es.addEventListener('put',e=>{const d=JSON.parse(e.data);applyEv(d.path,d.data);render()});
    es.addEventListener('patch',e=>{const d=JSON.parse(e.data);for(const k in d.data)applyEv((d.path==='/'?'':d.path)+'/'+k,d.data[k]);render()});
    es.onerror=()=>{if(++fails>3){es.close();startPoll()}};
  }catch(e){startPoll()}
  setInterval(render,5000);
})();
})();
</script>
